# Streamlit Cloud Secrets Configuration
# Place this file at: .streamlit/secrets.toml in your GitHub repo

# API Backend URL (use your production domain for Streamlit Cloud deployment)
API_BASE_URL = "http://localhost:8000"

# For production Streamlit Cloud:
# API_BASE_URL = "https://ai-research-assistant-backend.onrender.com"

# OpenAI Configuration (generate new key at https://platform.openai.com/api-keys)
OPENAI_API_KEY = "sk-your-new-key-here"

# Chroma Vector Database
CHROMA_DB_PATH = "./chroma_db"
CHROMA_COLLECTION_NAME = "research_documents"

# Server ports
API_HOST = "127.0.0.1"
API_PORT = 8000
FRONTEND_PORT = 8501

# Upload limits
MAX_FILE_SIZE_MB = 50
ALLOWED_EXTENSIONS = "pdf,txt"
